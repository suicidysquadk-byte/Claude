name: BattleHub Android

on:
  push:
    paths:
      - 'battlehub/**'
      - '.github/workflows/battlehub-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battlehub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: battlehub/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Ligar ao servidor (Supabase), se configurado
        env:
          SUPABASE_URL: ${{ secrets.BATTLEHUB_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.BATTLEHUB_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node scripts/escrever-config.js "$SUPABASE_URL" "$SUPABASE_ANON_KEY"
          else
            echo "Sem BATTLEHUB_SUPABASE_URL/ANON_KEY: o app abre na tela de configuração."
          fi

      - name: Testar as regras de dinheiro e a notificação num Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/money.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/competitivo.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/push.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/chat.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/banidos.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/organizador.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/lines.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/customizacao.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/personalizacao.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node --experimental-strip-types supabase/tests/asaas.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh ./supabase/tests/reset.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node --experimental-strip-types supabase/tests/efi.test.js
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=bh node supabase/tests/sem-delete-livre.test.js
          node scripts/cosmeticos/verificar.js

      - name: Carimbar o número da versão
        env:
          BATTLEHUB_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/app-release.js carimbo

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      # A chave de assinatura precisa ser SEMPRE a mesma, senão o Android não instala a versão nova por cima.
      # Se existir o secret BATTLEHUB_KEYSTORE_BASE64 ela vem dele; se não, fica guardada no Supabase (bucket privado),
      # criada sozinha na primeira vez.
      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.BATTLEHUB_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.BATTLEHUB_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BATTLEHUB_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.BATTLEHUB_KEY_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: tjaqjirsayclexzaycti
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
            { echo "BATTLEHUB_KEYSTORE=upload.jks"; echo "BATTLEHUB_KEYSTORE_PASSWORD=$KS_PASSWORD"; echo "BATTLEHUB_KEY_ALIAS=$KS_ALIAS"; echo "BATTLEHUB_KEY_PASSWORD=$KS_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            node scripts/app-release.js chave
          else
            echo "::warning::Sem chave de assinatura: gera só o APK de teste (não atualiza o app de ninguém)."
          fi

      - name: Gerar APK e AAB
        working-directory: battlehub/android
        env:
          BATTLEHUB_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$BATTLEHUB_KEYSTORE" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Publicar a atualização para quem já tem o app
        if: github.ref == 'refs/heads/claude/aprenda-tudo-kettmg'
        env:
          BATTLEHUB_VERSION_CODE: ${{ github.run_number }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: tjaqjirsayclexzaycti
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$BATTLEHUB_KEYSTORE" ]; then
            echo "::warning::Sem SUPABASE_ACCESS_TOKEN ou sem chave de assinatura: a atualização não foi publicada."
          else
            node scripts/app-release.js publicar
          fi

      - name: Apagar a chave do runner
        if: always()
        run: rm -f android/upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: battlehub-${{ github.run_number }}
          path: |
            battlehub/android/app/build/outputs/apk/**/*.apk
            battlehub/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
