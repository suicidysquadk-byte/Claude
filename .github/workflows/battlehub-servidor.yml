# Publica a atualização do servidor (banco e funções) no Supabase. Só roda quando alguém aperta
# "Run workflow" na aba Actions. As chaves ficam nos Secrets do repositório, nunca no código.
# Secrets usados: SUPABASE_ACCESS_TOKEN (obrigatório) e, se tiver, MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET (Mercado Pago).
name: BattleHub · publicar servidor

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: ID do projeto no Supabase
        default: tjaqjirsayclexzaycti
        required: true

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battlehub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci
      - name: Conferir o Access Token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Publicar banco, funções e chaves
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        run: |
          umask 077
          {
            echo "SUPABASE_ACCESS_TOKEN=$SUPABASE_ACCESS_TOKEN"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
            [ -n "$MP_ACCESS_TOKEN" ] && echo "MP_ACCESS_TOKEN=$MP_ACCESS_TOKEN"
            [ -n "$MP_WEBHOOK_SECRET" ] && echo "MP_WEBHOOK_SECRET=$MP_WEBHOOK_SECRET"
            true
          } > "$RUNNER_TEMP/conexao.env"
          bash scripts/configurar.sh "$RUNNER_TEMP/conexao.env"
      - name: Apagar as chaves do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/conexao.env"
