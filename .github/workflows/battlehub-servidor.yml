# Publica a atualização do servidor (banco e funções) no Supabase. Só roda quando alguém aperta
# "Run workflow" na aba Actions. As chaves ficam nos Secrets do repositório, nunca no código.
# Secrets usados: SUPABASE_ACCESS_TOKEN (obrigatório) e, se tiver, MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET (Mercado Pago),
# ASAAS_API_KEY, ASAAS_ENV (sandbox ou producao) e ASAAS_WEBHOOK_TOKEN (Asaas).
name: BattleHub · publicar servidor

on:
  push:
    branches: [claude/aprenda-tudo-kettmg]
    paths: ['battlehub/supabase/**', '.github/workflows/battlehub-servidor.yml']
  workflow_dispatch:
    inputs:
      project_ref:
        description: ID do projeto no Supabase
        default: tjaqjirsayclexzaycti
        required: true

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battlehub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci
      - name: Conferir o Access Token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Sem o secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions): nada foi publicado."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar banco, funções e chaves
        if: steps.token.outputs.ok == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref || 'tjaqjirsayclexzaycti' }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_ENV: ${{ secrets.ASAAS_ENV }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
        run: |
          umask 077
          {
            echo "SUPABASE_ACCESS_TOKEN=$SUPABASE_ACCESS_TOKEN"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
            [ -n "$MP_ACCESS_TOKEN" ] && echo "MP_ACCESS_TOKEN=$MP_ACCESS_TOKEN"
            [ -n "$MP_WEBHOOK_SECRET" ] && echo "MP_WEBHOOK_SECRET=$MP_WEBHOOK_SECRET"
            [ -n "$ASAAS_API_KEY" ] && echo "ASAAS_API_KEY=$ASAAS_API_KEY"
            [ -n "$ASAAS_ENV" ] && echo "ASAAS_ENV=$ASAAS_ENV"
            [ -n "$ASAAS_WEBHOOK_TOKEN" ] && echo "ASAAS_WEBHOOK_TOKEN=$ASAAS_WEBHOOK_TOKEN"
            true
          } > "$RUNNER_TEMP/conexao.env"
          bash scripts/configurar.sh "$RUNNER_TEMP/conexao.env"
      - name: Apagar as chaves do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/conexao.env"
